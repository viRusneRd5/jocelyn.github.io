# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Jocelyn Writes About Science
#email: your-email@example.com
description: >- # this means to ignore newlines until "baseurl:"
  I have a PhD in molecular biology, and I’m endlessly curious about the world we live in. This blog is where I share the fun things I’ve learned.
domain: my-site.github.io
#baseurl: "/blog" # the subpath of your site, e.g. /blog
url: https://virusnerd5.github.io # the base hostname & protocol for your site, e.g. http://example.com
#twitter_username: jekyllrb
github_username:  viRusneRd5

# Build settings
# GitHub Pages only supports a fixed list of themes, so Minimal Mistakes is loaded remotely.
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: default
locale: en-AU
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed

# Author details shown in the sidebar (layouts with `author_profile: true`)
author:
  name: "Jocelyn Hume"
  # To add a photo, save it as assets/images/bio-photo.jpg and uncomment:
  avatar: "/assets/images/bio-photo.jpg"
  bio: "I have a PhD in molecular biology, and I’m endlessly curious about the world we live in. This blog is where I share the fun things I’ve learned."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/viRusneRd5"
    # - label: "Substack"
    #   icon: "fas fa-fw fa-link"
    #   url: "https://YOUR-NAME.substack.com"
    # - label: "Email"
    #   icon: "fas fa-fw fa-envelope-square"
    #   url: "mailto:you@example.com"

# Default front matter, so each post doesn't need to repeat it
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      toc: true
      toc_label: "Contents"
      toc_sticky: true
      toc_levels: 2..3
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
